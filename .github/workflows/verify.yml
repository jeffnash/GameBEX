name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Unit tests + lint
        run: ./gradlew :app:testDebugUnitTest :source-runtime:test :app:lintDebug --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      - name: Extraction check (no app-owned source clients)
        run: |
          test -z "$(git grep -n 'GameBexApi' -- app/src/main source-runtime/src/main || true)"
          test -z "$(git grep -ln 'romsfun' -- source-runtime/src/main || true)"
          echo "check clean"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            source-runtime/build/reports/tests/
            source-runtime/build/test-results/
          retention-days: 7
